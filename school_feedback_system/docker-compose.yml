version: '3.8'

services:
  web:
    build: .
    container_name: school_feedback_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/data/feedback.db
      - SECRET_KEY=school-prod-secret-key-change-me
      - DEFAULT_ADMIN_USERNAME=admin
      - DEFAULT_ADMIN_PASSWORD=admin123
    volumes:
      - feedback_data:/app/data

volumes:
  feedback_data:
